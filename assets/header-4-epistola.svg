<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="IV. Epistola"><title>IV. Epistola</title><defs><pattern id="ht" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="5" stroke="#E6E2D8" stroke-width="0.9" opacity=".55"/></pattern><pattern id="ht2" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="3.2" stroke="#E6E2D8" stroke-width="0.7" opacity=".4"/></pattern></defs><style>.dl{fill:none;stroke:#E6E2D8;stroke-width:1;stroke-dasharray:1;animation:dr 2.6s ease-out both}.fadeb{animation:fi 2.4s ease-out .8s both}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes fi{from{opacity:0}to{opacity:1}}</style><rect width="1000" height="170" fill="#080808"/><path class="dl" pathLength="1" d="M300,150 V70 C300,40 440,26 500,8 C560,26 700,40 700,70 V150"/><path class="dl" pathLength="1" d="M314,150 V74 C314,50 446,36 500,22 C554,36 686,50 686,74 V150" style="stroke-width:.5"/><path class="dl" pathLength="1" d="M40,150 H300 M700,150 H960"/><path d="M40,142 H280 M720,142 H960" stroke="#5A5751" stroke-width=".6" class="fadeb"/><rect x="300" y="146" width="400" height="8" fill="url(#ht)" class="fadeb"/><path d="M500,40 l9,9 l-9,9 l-9,-9z" fill="none" stroke="#E6E2D8" stroke-width="1" class="fadeb"/><text x="500" y="53" text-anchor="middle" font-family="'Cormorant Garamond','EB Garamond',Garamond,'Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif" font-size="11" fill="#E6E2D8" class="fadeb">IV</text><text x="500" y="104" text-anchor="middle" font-family="'Cormorant Garamond','EB Garamond',Garamond,'Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif" font-style="italic" font-weight="600" font-size="44" letter-spacing="2" fill="#E6E2D8" class="fadeb">Epistola</text><text x="500" y="132" text-anchor="middle" font-family="'Cormorant